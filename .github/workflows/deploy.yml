name: サイトを更新

# Lemon Squeezy に登録された商品を drop-world.com に反映する。
#   - main に push したとき
#   - 1時間ごと（Lemon で商品を追加・価格を変更したものを拾うため）
#   - 手動（Actions タブ → 「サイトを更新」→ Run workflow）
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

# 同時に2つデプロイが走らないようにする（後から来た方は前の完了を待つ）
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 必要なシークレットがそろっているか確認
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
        run: |
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -z "$LEMONSQUEEZY_API_KEY" ]; then missing="$missing LEMONSQUEEZY_API_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::warning title=シークレット未登録::${missing} が未登録のためデプロイを飛ばしました。docs/POSTING.md の「最初に一度だけ」を参照してください。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージをインストール
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - name: Lemon から商品を取り込み、ビルドして Cloudflare にデプロイ
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
        run: npm run deploy
